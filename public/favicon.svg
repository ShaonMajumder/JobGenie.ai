<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64" role="img" aria-label="JobGenie.ai logo">
  <defs>
    <!-- Main accent gradient -->
    <linearGradient id="jg-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"></stop>
      <stop offset="50%" stop-color="#8B5CF6"></stop>
      <stop offset="100%" stop-color="#22C55E"></stop>
    </linearGradient>

    <!-- Glow gradient for spark -->
    <radialGradient id="jg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="1"></stop>
      <stop offset="60%" stop-color="#FACC15" stop-opacity="0.3"></stop>
      <stop offset="100%" stop-color="#FACC15" stop-opacity="0"></stop>
    </radialGradient>
  </defs>

  <!-- Dark rounded background -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#020617"></rect>

  <!-- Subtle inner ring for depth -->
  <rect x="7" y="7" width="50" height="50" rx="14" fill="none" stroke="rgba(148, 163, 184, 0.45)" stroke-width="1.5"></rect>

  <!-- "Genie J" stroke (represents both J + a guiding path) -->
  <path d="M24 16
       v20
       a8 8 0 0 0 8 8
       h8" fill="none" stroke="url(#jg-accent)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path>

  <!-- Dot at top of J (genie “head” / idea bulb) -->
  <circle cx="24" cy="13" r="2.6" fill="url(#jg-accent)"></circle>

  <!-- Magic spark glow near top-right (AI / magic assist) -->
  <circle cx="44" cy="18" r="6" fill="url(#jg-glow)"></circle>

  <!-- Magic spark icon -->
  <g transform="translate(44 18)">
    <line x1="-3" y1="0" x2="3" y2="0" stroke="#FACC15" stroke-width="1.4" stroke-linecap="round"></line>
    <line x1="0" y1="-3" x2="0" y2="3" stroke="#FACC15" stroke-width="1.4" stroke-linecap="round"></line>
    <line x1="-2.2" y1="-2.2" x2="2.2" y2="2.2" stroke="#FACC15" stroke-width="1.2" stroke-linecap="round" opacity="0.85"></line>
    <line x1="-2.2" y1="2.2" x2="2.2" y2="-2.2" stroke="#FACC15" stroke-width="1.2" stroke-linecap="round" opacity="0.85"></line>
  </g>

  <!-- Subtle "trail" under J to suggest motion / genie -->
  <path d="M20 42
       c4 4 10 6 17 6
       c4 0 7 -0.7 9 -1.7" fill="none" stroke="rgba(148, 163, 184, 0.6)" stroke-width="1.4" stroke-linecap="round"></path>
</svg>
